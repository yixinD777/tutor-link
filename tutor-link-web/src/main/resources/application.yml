server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: tutor-link

  # ====== 数据源 ======
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:tutor_link}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # ====== Flyway ======
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ====== Redis ======
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ====== Kafka ======
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      enable-idempotence: true
    consumer:
      group-id: tutor-link-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

  # ====== Jackson ======
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ====== MyBatis-Plus ======
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ====== JWT ======
jwt:
  secret: ${JWT_SECRET:tutorLinkSecretKeyForDevelopmentOnlyMustBeAtLeast256BitsLong!!}
  access-token-expiry: 7200000    # 2 hours
  refresh-token-expiry: 2592000000  # 30 days

# ====== WeChat ======
wechat:
  miniapp:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
  pay:
    mch-id: ${WX_MCH_ID:}
    api-key: ${WX_PAY_API_KEY:}
    cert-path: ${WX_PAY_CERT_PATH:}
    notify-url: ${WX_PAY_NOTIFY_URL:}

# ====== OSS ======
oss:
  endpoint: ${OSS_ENDPOINT:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:}

# ====== Knife4j ======
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  openapi:
    title: Tutor-Link API
    description: 家教直连平台 API 文档
    version: 1.0.0

# ====== Logging ======
logging:
  level:
    com.tutorlink: DEBUG
    org.springframework.kafka: INFO
